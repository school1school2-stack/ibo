<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير عملاء IBO البسيط</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-10">

    <!-- الهيدر -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2.5">
                <h1 class="text-lg sm:text-xl font-extrabold">مدير عملاء IPTV</h1>
                <span id="cloudStatus" class="text-[11px] bg-indigo-800/80 text-indigo-100 px-2.5 py-0.5 rounded-full font-bold">
                    جاري الربط...
                </span>
            </div>
            <div class="flex items-center gap-2">
                <a href="https://iboplayer.com/device/login" target="_blank" rel="noopener noreferrer"
                    class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold px-3 py-1.5 rounded-xl text-xs shadow transition">
                    موقع IBO ↗
                </a>
                <a href="http://shamel.tv/" target="_blank" rel="noopener noreferrer"
                    class="bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-extrabold px-3 py-1.5 rounded-xl text-xs shadow transition">
                    موقع Shamel ↗
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-5 space-y-5">

        <!-- نموذج إضافة / تعديل عميل -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">
                <h2 id="formTitle" class="text-sm font-extrabold text-slate-700">إضافة عميل جديد</h2>
                <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden text-xs font-bold text-rose-600 hover:underline">
                    إلغاء التعديل ✕
                </button>
            </div>
            <form id="clientForm" onsubmit="saveClient(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input type="hidden" id="editIdInput" value="">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">التطبيق</label>
                    <select id="appInput"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold bg-slate-50">
                        <option value="ibo">IBO Player</option>
                        <option value="shamel">Shamel TV</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">اسم العميل</label>
                    <input type="text" id="nameInput" required placeholder="مثال: أبو خالد"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الماك أدريس (MAC)</label>
                    <input type="text" id="macInput" required maxlength="17" dir="ltr" placeholder="00:1A:79:XX:XX:XX"
                        oninput="formatMac(this)"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm mono uppercase text-left bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الرقم السري (Key)</label>
                    <input type="text" id="keyInput" required dir="ltr" placeholder="123456"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm mono text-left bg-slate-50">
                </div>
                <div class="sm:col-span-4">
                    <button type="submit" id="submitBtn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-2.5 rounded-xl text-sm shadow-sm transition">
                        + حفظ العميل
                    </button>
                </div>
            </form>
        </section>

        <!-- مربع البحث وأزرار التصفية -->
        <div class="space-y-2.5">
            <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 ابحث بالاسم أو الماك..."
                class="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-200 focus:border-indigo-500 outline-none text-sm shadow-sm">
            
            <div class="flex items-center gap-2">
                <button type="button" onclick="setFilter('all')" id="btn-all"
                    class="px-4 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition">
                    الكل (<span id="count-all">0</span>)
                </button>
                <button type="button" onclick="setFilter('ibo')" id="btn-ibo"
                    class="px-4 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
                    IBO (<span id="count-ibo">0</span>)
                </button>
                <button type="button" onclick="setFilter('shamel')" id="btn-shamel"
                    class="px-4 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
                    Shamel (<span id="count-shamel">0</span>)
                </button>
            </div>
        </div>

        <!-- قائمة العملاء -->
        <section id="clientsList" class="space-y-3"></section>

        <!-- رسالة عند الفراغ -->
        <div id="emptyMsg" class="hidden text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400 text-sm">
            لا يوجد عملاء محفوظون حالياً
        </div>

    </main>

    <!-- إشعار النسخ -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-2.5 rounded-full text-xs sm:text-sm font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
        تم النسخ!
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات المشروع من الصورة + دعم البيئة
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyBeFpJ76MQ-NyldR9DG5bhyviE0PRzl-og",
            authDomain: "vulture-app-1efba.firebaseapp.com",
            databaseURL: "https://vulture-app-1efba-default-rtdb.firebaseio.com",
            projectId: "vulture-app-1efba",
            storageBucket: "vulture-app-1efba.firebasestorage.app",
            messagingSenderId: "27107131702",
            appId: "1:27107131702:web:2c782fbe400aba7c87b397",
            measurementId: "G-41J4JJZEZG"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vulture-app-1efba';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STORAGE_KEY = 'ibo_simple_clients_v1';
        let clients = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let currentFilter = 'all';
        let currentUser = null;
        let cloudReady = false;

        const APP_CONFIG = {
            ibo: {
                label: 'IBO Player',
                url: 'https://iboplayer.com/device/login',
                btnText: 'نسخ الماك وفتح IBO ↗',
                badgeClass: 'bg-amber-100 text-amber-800 border-amber-200',
                btnClass: 'bg-amber-400 hover:bg-amber-300 text-slate-900'
            },
            shamel: {
                label: 'Shamel TV',
                url: 'http://shamel.tv/',
                btnText: 'نسخ الماك وفتح Shamel ↗',
                badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                btnClass: 'bg-emerald-400 hover:bg-emerald-300 text-slate-900'
            }
        };

        function getClientsCol() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'clients');
        }

        function saveLocalBackup() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
        }

        function updateStatusBadge(text, isSuccess) {
            const el = document.getElementById('cloudStatus');
            if (!el) return;
            el.textContent = text;
            el.className = isSuccess
                ? 'text-[11px] bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 px-2.5 py-0.5 rounded-full font-bold'
                : 'text-[11px] bg-amber-500/20 text-amber-200 border border-amber-400/30 px-2.5 py-0.5 rounded-full font-bold';
        }

        async function initCloudSync() {
            renderList();
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    currentUser = cred.user;
                }

                // الاستماع المباشر للتحديثات السحابية
                onSnapshot(getClientsCol(), async (snapshot) => {
                    cloudReady = true;
                    updateStatusBadge('متصل بالسحابة ●', true);

                    const cloudList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    // إذا كانت السحابة فارغة ويوجد بيانات محلية، ارفعها للسحابة
                    if (cloudList.length === 0 && clients.length > 0) {
                        for (const item of clients) {
                            await addDoc(getClientsCol(), {
                                app: item.app || 'ibo',
                                name: item.name,
                                mac: item.mac,
                                key: item.key,
                                createdAt: Number(item.createdAt) || Date.now()
                            });
                        }
                        return;
                    }

                    clients = cloudList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    saveLocalBackup();
                    renderList();
                }, (error) => {
                    console.error("Cloud sync error:", error);
                    cloudReady = false;
                    updateStatusBadge('حفظ محلي (تحقق من قواعد Firestore)', false);
                });
            } catch (err) {
                console.error("Auth error:", err);
                cloudReady = false;
                updateStatusBadge('حفظ محلي (فعّل Anonymous Auth)', false);
            }
        }

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'ibo', 'shamel'].forEach(f => {
                const btn = document.getElementById('btn-' + f);
                if (f === filter) {
                    btn.className = 'px-4 py-1.5 rounded-xl text-xs font-extrabold bg-indigo-600 text-white shadow-sm transition';
                } else {
                    btn.className = 'px-4 py-1.5 rounded-xl text-xs font-extrabold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition';
                }
            });
            renderList();
        };

        window.formatMac = function(el) {
            let v = el.value.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
            el.value = (v.match(/.{1,2}/g)?.join(':') || '').substring(0, 17);
        };

        window.editClient = function(id) {
            const client = clients.find(c => String(c.id) === String(id));
            if (!client) return;

            document.getElementById('editIdInput').value = client.id;
            document.getElementById('appInput').value = client.app || 'ibo';
            document.getElementById('nameInput').value = client.name;
            document.getElementById('macInput').value = client.mac;
            document.getElementById('keyInput').value = client.key;

            document.getElementById('formTitle').textContent = 'تعديل بيانات العميل: ' + client.name;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '✓ حفظ التعديلات';
            submitBtn.className = 'w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-2.5 rounded-xl text-sm shadow-sm transition';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            document.getElementById('editIdInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('macInput').value = '';
            document.getElementById('keyInput').value = '';

            document.getElementById('formTitle').textContent = 'إضافة عميل جديد';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '+ حفظ العميل';
            submitBtn.className = 'w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-2.5 rounded-xl text-sm shadow-sm transition';
        };

        window.saveClient = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editIdInput').value;
            const appType = document.getElementById('appInput').value;
            const name = document.getElementById('nameInput').value.trim();
            const mac = document.getElementById('macInput').value.trim().toUpperCase();
            const key = document.getElementById('keyInput').value.trim();
            if (!name || !mac || !key) return;

            if (editId) {
                // تحديث عميل موجود
                const idx = clients.findIndex(c => String(c.id) === String(editId));
                if (idx !== -1) {
                    clients[idx] = { ...clients[idx], app: appType, name, mac, key };
                    saveLocalBackup();
                    renderList();
                }
                cancelEdit();
                showToast('تم حفظ التعديلات');

                if (cloudReady && currentUser) {
                    try {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', String(editId)), {
                            app: appType, name, mac, key
                        });
                    } catch (err) {
                        console.error("Cloud update error:", err);
                    }
                }
            } else {
                // إضافة عميل جديد فوراً في الواجهة
                const tempId = 'local_' + Date.now();
                const newItem = {
                    id: tempId,
                    app: appType,
                    name,
                    mac,
                    key,
                    createdAt: Date.now()
                };

                clients.unshift(newItem);
                saveLocalBackup();
                renderList();
                cancelEdit();
                showToast('تم حفظ العميل بنجاح');

                if (cloudReady && currentUser) {
                    try {
                        await addDoc(getClientsCol(), {
                            app: appType,
                            name,
                            mac,
                            key,
                            createdAt: newItem.createdAt
                        });
                    } catch (err) {
                        console.error("Cloud add error:", err);
                        showToast('حُفظ محلياً (تحقق من صلاحيات Firestore)');
                    }
                }
            }
        };

        window.deleteClient = async function(id) {
            clients = clients.filter(c => String(c.id) !== String(id));
            saveLocalBackup();
            renderList();
            showToast('تم حذف العميل');

            if (cloudReady && currentUser && !String(id).startsWith('local_')) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'clients', String(id)));
                } catch (err) {
                    console.error("Cloud delete error:", err);
                }
            }
        };

        window.copyText = function(text, label) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(label);
        };

        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.add('opacity-0'), 2500);
        }

        window.renderList = function() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('clientsList');
            const emptyMsg = document.getElementById('emptyMsg');

            // تحديث العدادات
            document.getElementById('count-all').textContent = clients.length;
            document.getElementById('count-ibo').textContent = clients.filter(c => (c.app || 'ibo') === 'ibo').length;
            document.getElementById('count-shamel').textContent = clients.filter(c => c.app === 'shamel').length;

            const filtered = clients.filter(c => {
                const clientApp = c.app || 'ibo';
                const matchesApp = currentFilter === 'all' || clientApp === currentFilter;
                const matchesSearch = c.name.toLowerCase().includes(q) || c.mac.toLowerCase().includes(q);
                return matchesApp && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            container.innerHTML = filtered.map(c => {
                const appInfo = APP_CONFIG[c.app || 'ibo'];
                return `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-slate-800 text-base">${escapeHtml(c.name)}</span>
                            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-lg border ${appInfo.badgeClass}">
                                ${appInfo.label}
                            </span>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5">
                            <a href="${appInfo.url}" target="_blank" rel="noopener noreferrer"
                                onclick="copyText('${escapeHtml(c.mac)}', 'تم نسخ الماك وفتح الموقع')"
                                class="${appInfo.btnClass} font-bold px-3 py-1.5 rounded-xl text-xs transition">
                                ${appInfo.btnText}
                            </a>
                            <button type="button" onclick="editClient('${c.id}')"
                                class="bg-slate-100 hover:bg-indigo-50 text-indigo-700 font-bold px-2.5 py-1.5 rounded-xl text-xs transition">
                                تعديل
                            </button>
                            <button type="button" onclick="deleteClient('${c.id}')"
                                class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-2.5 py-1.5 rounded-xl text-xs transition">
                                حذف
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <!-- صف الماك -->
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/60 flex items-center justify-between gap-2">
                            <div class="overflow-hidden">
                                <span class="text-[11px] text-slate-400 block font-bold">MAC</span>
                                <code class="text-sm font-bold text-indigo-700 mono">${escapeHtml(c.mac)}</code>
                            </div>
                            <button type="button" onclick="copyText('${escapeHtml(c.mac)}', 'تم نسخ الماك')"
                                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs shrink-0 transition">
                                نسخ الماك
                            </button>
                        </div>

                        <!-- صف الرقم السري -->
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/60 flex items-center justify-between gap-2">
                            <div class="overflow-hidden">
                                <span class="text-[11px] text-slate-400 block font-bold">KEY</span>
                                <code class="text-sm font-bold text-slate-800 mono">${escapeHtml(c.key)}</code>
                            </div>
                            <button type="button" onclick="copyText('${escapeHtml(c.key)}', 'تم نسخ الرقم السري')"
                                class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3.5 py-2 rounded-xl text-xs shrink-0 transition">
                                نسخ الرقم السري
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        initCloudSync();
    </script>
</body>
</html>
